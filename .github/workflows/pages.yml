name: Publish game for browser play

# Keeps the `gh-pages` branch up to date with the latest built game so it can be
# played in any browser with no download:
#   • instant link (no setup):  https://raw.githack.com/climberkeenan-tech/Code-project-experiment-1/gh-pages/index.html
#   • or enable GitHub Pages (Settings → Pages → Deploy from a branch → gh-pages → /root)
#     for  https://climberkeenan-tech.github.io/Code-project-experiment-1/
# It publishes the already-built bundle (latest builds/*.zip) — no npm build in
# CI to fail — and only needs `contents: write` (no Pages-admin permission).

on:
  push:
    branches: ["claude/3d-space-exploration-game-ogrezx"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-play
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the latest prebuilt game at branch root
        run: |
          set -e
          mkdir -p _site
          zip="$(ls builds/starfall-frontier-build*.zip | sort -V | tail -1)"
          echo "Publishing $zip"
          unzip -o "$zip" -d _site
          test -f _site/index.html
          touch _site/.nojekyll

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish built game (auto)"
